name: Auto Run Radar Facebook 2H

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'  # 👈 THÊM DÒNG NÀY

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 pandas opencv-python ultralytics torch openpyxl
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Python script
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update data $(date +'%Y-%m-%d %H:%M:%S')" && git push)
